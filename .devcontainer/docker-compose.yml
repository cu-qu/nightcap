# Compose stack for the repo-root Dev Container.
# Bind paths are relative to this file (.devcontainer/).
name: nightcap

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-night_cap}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-night_cap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspace:cached
      - mobile_node_modules:/workspace/mobile/node_modules
    working_dir: /workspace
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-night_cap}
      DJANGO_DB_USER: ${POSTGRES_USER:-postgres}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /workspace/backend
      EXPO_PUBLIC_API_URL: http://localhost:8002
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sleep infinity

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace/backend
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-night_cap}
      DJANGO_DB_USER: ${POSTGRES_USER:-postgres}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /workspace/backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A config worker -Q celery -l info

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace/backend
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-night_cap}
      DJANGO_DB_USER: ${POSTGRES_USER:-postgres}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /workspace/backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A config beat -l info

volumes:
  postgres_data:
  mobile_node_modules:
