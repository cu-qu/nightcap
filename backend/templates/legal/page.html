<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · NightCap</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0a1a;
        color: #f5f3ff;
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      nav {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
      a {
        color: #c4b5fd;
      }
      h1 {
        font-size: 1.85rem;
        margin: 0 0 1rem;
      }
      h2 {
        font-size: 1.2rem;
        margin: 2rem 0 0.6rem;
      }
      p, ul {
        color: #d4d0e3;
      }
      ul {
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/support/">Support</a>
      </nav>
      {{ body|safe }}
    </main>
  </body>
</html>
