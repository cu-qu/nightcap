<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your NightCap password</title>
  </head>
  <body>
    <p>Hi {{ username }},</p>
    <p>We received a request to reset your NightCap password.</p>
    <p><a href="{{ reset_url }}">Choose a new password</a></p>
    <p>If the button does not work, copy and paste this link into your browser:</p>
    <p>{{ reset_url }}</p>
    <p>If you did not request this, you can ignore this email.</p>
    <p>The NightCap team</p>
  </body>
</html>
