<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Confirm your NightCap email</title>
  </head>
  <body>
    <p>Hi {{ username }},</p>
    <p>Thanks for joining NightCap. Verify your email to finish setting up your account.</p>
    <p><a href="{{ verify_url }}">Verify my email</a></p>
    <p>If the button does not work, copy and paste this link into your browser:</p>
    <p>{{ verify_url }}</p>
    <p>If you did not create an account, you can ignore this message.</p>
    <p>The NightCap team</p>
  </body>
</html>
