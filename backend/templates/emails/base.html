<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>{% block title %}NightCap{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#0f0a1a;">
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
      {% block preheader %}{% endblock %}
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f0a1a;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#1a1228;border:1px solid #3d2a55;border-radius:20px;">
            <tr>
              <td style="padding:36px 32px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:34px;font-weight:700;color:#a78bfa;">
                NightCap
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:22px;line-height:28px;font-weight:700;color:#f4eeff;">
                {% block headline %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:24px;color:#9b8bb0;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            {% block extra %}{% endblock %}
            <tr>
              <td style="padding:20px 32px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:20px;color:#9b8bb0;">
                {% block note %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
