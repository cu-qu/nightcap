<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · NightCap</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0a1a;
        color: #f5f3ff;
        line-height: 1.55;
      }
      main { max-width: 32rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
      h1 { font-size: 1.85rem; margin: 0 0 1rem; }
      p, label { color: #d4d0e3; }
      form { display: flex; flex-direction: column; gap: 0.75rem; }
      input {
        border: 1px solid #3b3354;
        border-radius: 12px;
        background: #1b1430;
        color: #f5f3ff;
        font-size: 1rem;
        padding: 0.9rem 1rem;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #c4b5fd;
        color: #1b1430;
        font-size: 1rem;
        font-weight: 650;
        padding: 0.9rem 1rem;
      }
      .error { color: #fda4af; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <p>Choose a new password of at least 8 characters.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="uid" value="{{ uid }}" />
        <input type="hidden" name="token" value="{{ token }}" />
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8" />
        <button type="submit">Update password</button>
      </form>
    </main>
  </body>
</html>
