<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · NightCap</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0a1a;
        color: #f5f3ff;
        line-height: 1.55;
      }
      main { max-width: 32rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
      h1 { font-size: 1.85rem; margin: 0 0 1rem; }
      p { color: #d4d0e3; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
    </main>
  </body>
</html>
